async function requestWakeLock() {
  // Primary: Screen Wake Lock API
  try {
    if('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      return;
    }
  } catch(e) { console.log('Wake Lock API not available:', e.message); }

  // Fallback: silent looping video keeps the screen on in most browsers
  startNoSleepVideo();
}
function releaseWakeLock() {
  if(wakeLock) { try { wakeLock.release(); } catch(e){} wakeLock = null; }
  stopNoSleepVideo();
}

function startNoSleepVideo() {
  if(noSleepVideo) return;
  try {
    var v = document.createElement('video');
    v.setAttribute('playsinline', '');
    v.setAttribute('muted', '');
    v.setAttribute('loop', '');
    v.muted = true;
    v.style.position = 'fixed';
    v.style.top = '0';
    v.style.left = '0';
    v.style.width = '1px';
    v.style.height = '1px';
    v.style.opacity = '0';
    v.style.pointerEvents = 'none';
    v.src = NOSLEEP_SRC;
    document.body.appendChild(v);
    var p = v.play();
    if(p && p.catch) p.catch(function(e){ console.log('NoSleep video play failed:', e.message); });
    noSleepVideo = v;
  } catch(e) { console.log('NoSleep video fallback failed:', e.message); }
}
function stopNoSleepVideo() {
  if(noSleepVideo) {
    try { noSleepVideo.pause(); noSleepVideo.remove(); } catch(e){}
    noSleepVideo = null;
  }
}


// Build <option> elements for session type selector
function typeOptions(current) {
  var types = [
    {v:'pull', l:'Pull'},
    {v:'push', l:'Push'},
    {v:'legs', l:'Legs'},
    {v:'upper', l:'Upper'},
    {v:'circuit', l:'Circuit'},
    {v:'cardio', l:'Cardio'},
    {v:'af', l:'AF Full Body'},
    {v:'af_bicep', l:'AF Bicep Friendly'}
  ];
  return types.map(function(t){
    return '<option value="'+t.v+'"'+(t.v===current?' selected':'')+'>'+t.l+'</option>';
  }).join('');
}

function buildFlatList(sess) {
  var flat = [];
  (sess.groups||[]).forEach(function(g, gi) {
    g.exercises.forEach(function(ex, ei) {
      flat.push({gi:gi, ei:ei, vk: sess.id+'-'+gi+'-'+ei, groupType: g.type});
    });
  });
  return flat;
}

function startTraining(sessId, wk) {
  var sess = findSess(sessId, wk);
  if(!sess) return;
  var flat = buildFlatList(sess);
  if(!flat.length) { alert('Add some exercises first.'); return; }
  tmState = { sessId: sessId, wk: wk, flat: flat, idx: 0 };
  document.getElementById('tm-overlay').classList.add('open');
  requestWakeLock();
  renderTM();
}


function showJumpPicker() {
  if(!tmState) return;
  var sess = findSess(tmState.sessId, tmState.wk);
  if(!sess) return;

  var overlay = document.getElementById('tm-jump-overlay');
  var html = '<div class="tm-jump-hdr"><span class="tm-jump-title">Jump to exercise</span><button class="tm-close" id="tm-jump-close">&#10005; Close</button></div>'
    + '<div class="tm-jump-list">';

  tmState.flat.forEach(function(it, i) {
    var g = sess.groups[it.gi];
    var ex = g.exercises[it.ei];
    var T = setTrackers[it.vk];
    var done = T && T.totalSets>0 && T.setsDone>=T.totalSets;
    var statusHtml = done ? '<span class="tm-jump-status done">done</span>' : '<span class="tm-jump-status pending">'+(T?T.setsDone:0)+'/'+(parseInt(ex.sets)||3)+'</span>';
    html += '<div class="tm-jump-item'+(i===tmState.idx?' current':'')+'" data-idx="'+i+'">'
      + '<span class="tm-jump-num">'+(i+1)+'</span>'
      + '<span class="tm-jump-name">'+(ex.name||'(unnamed exercise)')+'</span>'
      + statusHtml
      + '</div>';
  });
  html += '<button class="tm-add-ex-btn" id="tm-add-ex">+ add exercise to workout</button>';
  html += '</div>';
  overlay.innerHTML = html;
  overlay.classList.add('open');

  overlay.querySelector('#tm-jump-close').addEventListener('click', function(){
    overlay.classList.remove('open');
  });
  overlay.querySelectorAll('.tm-jump-item').forEach(function(item){
    item.addEventListener('click', function(){
      tmState.idx = parseInt(item.dataset.idx);
      overlay.classList.remove('open');
      renderTM();
    });
  });

  var addExBtn = overlay.querySelector('#tm-add-ex');
  if(addExBtn) addExBtn.addEventListener('click', function(){
    // Add a new single-exercise group at the end of the session
    sess.groups.push(mkGrp('normal', ['']));
    save();
    // Rebuild the flat list and jump to the new (last) exercise
    tmState.flat = buildFlatList(sess);
    tmState.idx = tmState.flat.length - 1;
    overlay.classList.remove('open');
    renderTM();
  });
}

function exitTraining() {
  document.getElementById('tm-overlay').classList.remove('open');
  releaseWakeLock();
  tmState = null;
  renderAll(); // refresh underlying view in case data changed
}

function showExitConfirm() {
  if(!tmState) return;
  var sess = findSess(tmState.sessId, tmState.wk);
  if(!sess) { exitTraining(); return; }

  // Count completed exercises (all sets done)
  var completed = 0, total = tmState.flat.length;
  tmState.flat.forEach(function(it){
    var T = setTrackers[it.vk];
    if(T && T.totalSets>0 && T.setsDone>=T.totalSets) completed++;
  });

  // Session time so far
  var ST = sessTimers[tmState.sessId];
  var elapsed = ST ? (ST.run ? ST.elapsed+(Date.now()-ST.start) : ST.elapsed) : 0;

  var allDone = completed === total;

  var overlay = document.getElementById('tm-exit-overlay');
  overlay.innerHTML = '<div class="tm-exit-title">'+(allDone?'Workout complete!':'Finish workout?')+'</div>'
    + '<div class="tm-exit-sub">'+(allDone?'Great session.':'You can come back and finish later.')+'</div>'
    + '<div class="tm-exit-stats">'
      + '<div class="tm-exit-stat"><div class="tm-exit-stat-val">'+completed+'/'+total+'</div><div class="tm-exit-stat-lbl">exercises done</div></div>'
      + '<div class="tm-exit-stat"><div class="tm-exit-stat-val">'+fmtHMS(elapsed).slice(0,5)+'</div><div class="tm-exit-stat-lbl">time</div></div>'
    + '</div>'
    + '<div class="tm-exit-btns">'
      + '<button class="tm-exit-finish" id="tm-exit-finish">'+(allDone?'Finish & save':'End session')+'</button>'
      + '<button class="tm-exit-cancel" id="tm-exit-cancel">Keep training</button>'
    + '</div>';

  overlay.style.display = 'flex';

  document.getElementById('tm-exit-finish').addEventListener('click', function(){
    // Mark session as completed and stop the timer, mirroring the session bar End behaviour
    if(ST) {
      if(ST.run) { ST.elapsed += Date.now()-ST.start; ST.run=false; clearInterval(ST.iv); clearInterval(ST.tmIv); }
      ST.ended = true;
    }
    sess.completed = true;
    sess.completedTime = elapsed;
    sess.completedDate = new Date().toISOString();
    save();
    updateStats();
    overlay.style.display = 'none';
    exitTraining();
  });

  document.getElementById('tm-exit-cancel').addEventListener('click', function(){
    overlay.style.display = 'none';
  });
}

function tmSessionTimer() {
  var sess = findSess(tmState.sessId, tmState.wk);
  if(!sess) return;
  if(!sessTimers[tmState.sessId]) sessTimers[tmState.sessId] = {run:false,start:0,elapsed:0,iv:null,ended:false};
  var T = sessTimers[tmState.sessId];
  var clockEl = document.getElementById('tm-session-clock');
  var btnEl = document.getElementById('tm-session-btn');

  function upd() {
    var el = document.getElementById('tm-session-clock');
    if(!el) return;
    el.textContent = fmtHMS(T.run ? T.elapsed + (Date.now()-T.start) : T.elapsed);
    el.className = 'tm-session-clock' + (T.run ? ' running' : '');
  }
  clearInterval(T.tmIv); T.tmIv = null;
  upd();
  if(T.run) T.tmIv = setInterval(upd, 500);

  if(btnEl) {
    btnEl.textContent = T.ended ? 'Ended' : (T.run ? 'Pause' : (T.elapsed>0 ? 'Resume' : 'Start'));
    btnEl.className = 'tm-session-btn' + (T.run ? ' pause' : '');
    btnEl.disabled = !!T.ended;
    btnEl.onclick = function() {
      if(T.ended) return;
      if(T.run) {
        clearInterval(T.iv); T.iv=null; clearInterval(T.tmIv); T.tmIv=null;
        T.elapsed += Date.now()-T.start; T.run=false;
      } else {
        T.start = Date.now(); T.run = true;
        T.tmIv = setInterval(upd, 500);
      }
      upd();
      btnEl.textContent = T.run ? 'Pause' : 'Resume';
      btnEl.className = 'tm-session-btn' + (T.run ? ' pause' : '');
    };
  }
}

function renderTM() {
  if(!tmState) return;
  var sess = findSess(tmState.sessId, tmState.wk);
  if(!sess) { exitTraining(); return; }
  var item = tmState.flat[tmState.idx];
  var g = sess.groups[item.gi];
  var ex = g.exercises[item.ei];
  var vk = item.vk;
  var isS = g.type === 'superset', isD = g.type === 'dropset';

  // Progress dots
  var progEl = document.getElementById('tm-progress');
  progEl.innerHTML = '';
  tmState.flat.forEach(function(it, i) {
    var T = setTrackers[it.vk];
    var cls = 'tm-progress-dot';
    if(i === tmState.idx) cls += ' current';
    else if(T && T.setsDone >= T.totalSets && T.totalSets > 0) cls += ' done';
    var d = document.createElement('div');
    d.className = cls;
    d.addEventListener('click', function(){ tmState.idx = i; renderTM(); });
    progEl.appendChild(d);
  });

  // % complete + estimated remaining time
  var totalSetsAll = 0, doneSetsAll = 0;
  tmState.flat.forEach(function(it){
    var Ti = setTrackers[it.vk];
    var planned = Ti ? Ti.totalSets : (parseInt(sess.groups[it.gi].exercises[it.ei].sets)||3);
    totalSetsAll += planned;
    doneSetsAll += Ti ? Math.min(Ti.setsDone, planned) : 0;
  });
  var pct = totalSetsAll > 0 ? Math.round(doneSetsAll / totalSetsAll * 100) : 0;
  var pctEl = document.getElementById('tm-pct');
  var fillEl = document.getElementById('tm-pct-fill');
  var remainEl = document.getElementById('tm-remain');
  if(pctEl) pctEl.textContent = pct + '% complete';
  if(fillEl) fillEl.style.width = pct + '%';
  if(remainEl) {
    // Estimate remaining time: count unstarted/partial exercises
    var remainSecs = 0;
    tmState.flat.forEach(function(it){
      var Ti = setTrackers[it.vk];
      var ex2 = sess.groups[it.gi].exercises[it.ei];
      var planned = Ti ? Ti.totalSets : (parseInt(ex2.sets)||3);
      var done = Ti ? Math.min(Ti.setsDone, planned) : 0;
      var remaining = planned - done;
      if(remaining > 0) {
        remainSecs += remaining * 60;                          // set time
        remainSecs += Math.max(0, remaining - 1) * 90;        // rest between
        if(done === 0) remainSecs += 120;                     // transition if not started
      }
    });
    var remainMins = Math.round(remainSecs / 60);
    remainEl.textContent = remainMins > 0 ? '~' + remainMins + ' min left' : 'almost done!';
  }

  // Nav label + buttons
  document.getElementById('tm-nav-lbl').textContent = (tmState.idx+1) + ' / ' + tmState.flat.length;
  var prevBtn = document.getElementById('tm-prev-ex'), nextBtn = document.getElementById('tm-next-ex');
  prevBtn.disabled = tmState.idx === 0;
  nextBtn.disabled = tmState.idx === tmState.flat.length - 1;
  prevBtn.onclick = function(){ if(tmState.idx>0){tmState.idx--;renderTM();} };
  nextBtn.onclick = function(){ if(tmState.idx<tmState.flat.length-1){tmState.idx++;renderTM();} };

  // History
  var hist = ex.name ? getAllHist(ex.name) : [];
  var last = hist.length ? hist[hist.length-1] : null;
  var pr = hist.length ? hist.reduce(function(a,b){return (b.weight>a.weight)?b:a;}, hist[0]) : null;

  var totalSets = parseInt(ex.sets)||3;
  var T = getTracker(vk, totalSets);

  var bodyEl = document.getElementById('tm-body');
  var html = '';

  if(isS || isD) {
    html += '<div class="tm-grp-badge '+(isS?'gb-s':'gb-d')+'">'+(isS?'Superset':'Drop set')+' - exercise '+(item.ei+1)+' of '+g.exercises.length+'</div>';
  }

  // Exercise name (editable if empty)
  if(ex.name) {
    html += '<div class="tm-ex-name" id="tm-ex-name">'+ex.name+'</div>';
  } else {
    html += '<input type="text" class="tm-ex-name-input" id="tm-ex-name-input" placeholder="Exercise name...">';
  }

  if(ex.notes) html += '<div class="tm-ex-notes">'+ex.notes+'</div>';

  // PR badge (kept compact, separate from the tabbed view)
  if(pr) {
    html += '<div class="tm-history"><div class="tm-hist-box"><div class="tm-hist-val">'+pr.weight+'kg</div><div class="tm-hist-lbl">personal best</div></div></div>';
  }

  // Planned / Last time tabbed view (only shown before all sets are done -
  // once sets are completed, the set log below takes over as the primary view)
  if(T.setsDone < T.totalSets) {
    if(!tmViewTab[vk]) tmViewTab[vk] = 'planned';
    var curTab = tmViewTab[vk];
    html += '<div class="tm-plan-tabs">'
      + '<button class="tm-plan-tab'+(curTab==='planned'?' active':'')+'" data-tab="planned">Planned</button>'
      + '<button class="tm-plan-tab'+(curTab==='last'?' active':'')+'" data-tab="last">Last time</button>'
      + '</div>';

    html += '<div class="tm-plan-rows" id="tm-plan-rows">';
    if(curTab === 'planned') {
      var plannedReps = ex.reps || '', plannedKg = ex.weight || '';
      for(var pi=0; pi<T.totalSets; pi++) {
        var isDoneRow = pi < T.setsDone;
        html += '<div class="tm-plan-row'+(isDoneRow?' done':'')+'">'
          + '<span class="tm-plan-row-num"><span class="tm-plan-check'+(isDoneRow?' done':'')+'"></span>Set '+(pi+1)+'</span>'
          + '<input type="text" class="tm-plan-row-inp" data-pf="reps" data-pi="'+pi+'" value="'+(isDoneRow&&T.setLog[pi]?T.setLog[pi].reps:plannedReps)+'" placeholder="reps"'+(isDoneRow?' disabled':'')+'>'
          + '<span class="tm-plan-row-x">&times;</span>'
          + '<input type="text" class="tm-plan-row-inp" data-pf="kg" data-pi="'+pi+'" value="'+(isDoneRow&&T.setLog[pi]?T.setLog[pi].kg:plannedKg)+'" placeholder="kg"'+(isDoneRow?' disabled':'')+'>'
          + '</div>';
      }
    } else {
      // Last time tab - read only history rows from previous session
      if(hist.length === 0) {
        html += '<div class="tm-plan-empty">No previous data for this exercise yet.</div>';
      } else {
        hist.slice(-6).forEach(function(h, hi) {
          html += '<div class="tm-plan-row">'
            + '<span class="tm-plan-row-num">Set '+(h.setNum||hi+1)+'</span>'
            + '<span class="tm-plan-row-static">'+(h.reps||'-')+' &times; '+(h.weight||'-')+'kg</span>'
            + '</div>';
        });
      }
    }
    html += '</div>';
  }

  // Completed set log - show what's been done so far for this exercise
  if(T.setLog && T.setLog.length > 0) {
    html += '<div class="tm-set-log">';
    T.setLog.forEach(function(entry) {
      var val = '';
      if(entry.reps && entry.kg) val = entry.reps + ' reps @ ' + entry.kg + 'kg';
      else if(entry.reps) val = entry.reps + ' reps';
      else if(entry.kg) val = entry.kg + 'kg';
      else val = 'logged';
      var secs = Math.round((entry.time||0)/1000);
      var timeStr = secs > 0 ? pad2(Math.floor(secs/60))+':'+pad2(secs%60) : '';
      html += '<div class="tm-set-log-row">'
        + '<span class="tm-set-log-num">Set '+entry.setNum+'</span>'
        + '<span class="tm-set-log-val">'+val+'</span>'
        + (timeStr ? '<span class="tm-set-log-time">'+timeStr+'</span>' : '')
        + '</div>';
    });
    html += '</div>';
  }

  // Tracker area
  html += '<div class="tm-tracker" id="tm-tracker"></div>';

  bodyEl.innerHTML = html;

  // Bind name input
  var nameInp = document.getElementById('tm-ex-name-input');
  if(nameInp) {
    setTimeout(function(){ try{nameInp.focus();}catch(e){} }, 80);
    function saveTMName(){
      if(nameInp.value.trim()){ ex.name = nameInp.value.trim(); ex.planned=false; save(); renderTM(); }
    }
    nameInp.addEventListener('blur', saveTMName);
    nameInp.addEventListener('keydown', function(e){ if(e.key==='Enter'){e.preventDefault();saveTMName();} });
  }
  // Double tap name to rename
  var nameEl = document.getElementById('tm-ex-name');
  if(nameEl) {
    nameEl.addEventListener('dblclick', function(){
      ex.name=''; renderTM();
    });
  }

  // Planned/Last time tab switching
  bodyEl.querySelectorAll('.tm-plan-tab').forEach(function(tabBtn){
    tabBtn.addEventListener('click', function(){
      tmViewTab[vk] = tabBtn.dataset.tab;
      renderTM();
    });
  });

  // Editable planned-set rows (reps/kg pre-fill before starting)
  bodyEl.querySelectorAll('.tm-plan-row-inp').forEach(function(inp){
    inp.addEventListener('input', function(){
      var pi = parseInt(inp.dataset.pi);
      var field = inp.dataset.pf; // 'reps' or 'kg'
      // Only the next upcoming set's values feed into curReps/curKg when the set is started.
      // Editing the plan here updates ex.reps/ex.weight (the overall plan) if it's set 0,
      // otherwise it just lets the person see/adjust what they intend to log per set.
      if(pi === T.setsDone) {
        if(field === 'reps') T.curReps = inp.value;
        else T.curKg = inp.value;
      }
      if(pi === 0) {
        if(field === 'reps') ex.reps = inp.value;
        else ex.weight = inp.value;
        save();
      }
    });
  });

  renderTMTracker(vk, ex);
  tmSessionTimer();
}



function startGetReady(vk) {
  var T = setTrackers[vk];
  clearInterval(T.restIv);
  T.state = 'getready';
  T.readyRemain = 10;
}

function bindAddSetBtn(panel, T, ex) {
  var addSetBtn = panel.querySelector('#tm-add-set');
  if(addSetBtn) addSetBtn.addEventListener('click', function(){
    T.totalSets++;
    ex.sets = String(T.totalSets);
    save();
    renderTM();
  });
}

function renderTMTracker(vk, ex) {
  var panel = document.getElementById('tm-tracker');
  if(!panel) return;
  var T = setTrackers[vk];
  if(!T) return;
  var TM_RING_C = 439.6; // r=70

  if(T.state === 'idle') {
    var pips='', done=T.setsDone, total=T.totalSets;
    for(var i=0;i<total;i++) pips += '<div class="tm-pip'+(i<done?'':' empty')+'"></div>';
    var allDone = done>=total;
    panel.innerHTML = '<div class="tm-pips">'+pips+'</div>'
      + '<div class="tm-set-lbl">'+(allDone?'All sets done':done+' of '+total+' sets done')+'</div>'
      + (allDone
          ? '<button class="tm-action-btn alldone" id="tm-reset">Reset exercise</button>'
          + (tmState.idx < tmState.flat.length-1 ? '<button class="tm-action-btn next-ex" id="tm-go-next">Next exercise &#8594;</button>' : '')
          : '<button class="tm-action-btn" id="tm-start">'+(done===0?'Start set 1':'Start set '+(done+1))+'</button>')
      + '<button class="tm-add-set-btn" id="tm-add-set">+ add set</button>';

    var sb = panel.querySelector('#tm-start');
    if(sb) sb.addEventListener('click', function(){ startMySet(vk); renderTM(); });
    var rb = panel.querySelector('#tm-reset');
    if(rb) rb.addEventListener('click', function(){
      clearInterval(T.setIv); clearInterval(T.restIv); clearInterval(T.readyIv);
      T.setsDone=0; T.state='idle'; T.setTimer=0; T.setLog=[]; T.curReps=''; T.curKg='';
      renderTM();
    });
    var gn = panel.querySelector('#tm-go-next');
    if(gn) gn.addEventListener('click', function(){
      if(tmState.idx<tmState.flat.length-1){tmState.idx++;renderTM();}
    });
    bindAddSetBtn(panel, T, ex);
    return;
  }

  if(T.state === 'getready') {
    panel.innerHTML = '<div class="tm-getready-lbl">Get ready</div>'
      + '<div class="tm-getready-num" id="tm-ready-num">'+T.readyRemain+'</div>'
      + '<div class="tm-set-lbl">Set '+(T.setsDone+1)+' of '+T.totalSets+' starting soon</div>'
      + '<button class="tm-start-now-btn" id="tm-start-now">Start now</button>';

    panel.querySelector('#tm-start-now').addEventListener('click', function(){
      clearInterval(T.readyIv);
      startMySet(vk);
      renderTM();
    });

    clearInterval(T.readyIv);
    var readyStart = Date.now();
    T.readyIv = setInterval(function(){
      var remain = 10 - Math.floor((Date.now()-readyStart)/1000);
      T.readyRemain = Math.max(0, remain);
      var numEl = document.getElementById('tm-ready-num');
      if(numEl) numEl.textContent = T.readyRemain;
      if(remain <= 0) {
        clearInterval(T.readyIv);
        startMySet(vk);
        renderTM();
      }
    }, 250);
    return;
  }

  if(T.state === 'active') {
    var ssLabel = (T.supersetPeers && T.supersetPeers.length>1) ? '<span class="sf-badge">Superset</span> ' : '';
    panel.innerHTML = '<div class="tm-set-lbl">'+ssLabel+'Set '+(T.setsDone+1)+' of '+T.totalSets+'</div>'
      + '<div class="tm-big-clock" id="tm-clock">0:00</div>'
      + '<div class="tm-set-inputs">'
        + '<div class="tm-set-field"><label>reps</label><input class="tm-set-inp" id="tm-reps" type="number" inputmode="numeric" placeholder="-" value="'+(T.curReps||'')+'"></div>'
        + '<div class="tm-set-field"><label>kg</label><input class="tm-set-inp" id="tm-kg" type="number" inputmode="decimal" step="0.5" placeholder="-" value="'+(T.curKg||'')+'"></div>'
      + '</div>'
      + '<button class="tm-action-btn" id="tm-done">Done - start rest</button>'
      + '<button class="tm-add-set-btn" id="tm-add-set">+ add set</button>';

    var repsInp=panel.querySelector('#tm-reps'), kgInp=panel.querySelector('#tm-kg');
    if(repsInp) repsInp.addEventListener('input',function(){T.curReps=repsInp.value;});
    if(kgInp) kgInp.addEventListener('input',function(){T.curKg=kgInp.value;});
    panel.querySelector('#tm-done').addEventListener('click', function(){
      doneMySet(vk);
      syncTMAfterSet(vk);
    });
    bindAddSetBtn(panel, T, ex);

    clearInterval(T.setIv);
    T.setStart = Date.now() - T.setTimer;
    T.setIv = setInterval(function(){
      T.setTimer = Date.now()-T.setStart;
      var el=document.getElementById('tm-clock');
      if(el){var s=Math.floor(T.setTimer/1000);el.textContent=pad2(s/60)+':'+pad2(s%60);}
    }, 200);
    return;
  }

  if(T.state === 'resting') {
    var isDone = T.setsDone >= T.totalSets;
    var frac = Math.max(0, Math.min(1, T.restRemain/T.restTarget));
    var offset = TM_RING_C*(1-frac);
    var over = T.restRemain <= 0;
    var urgent = T.restRemain <= 10 && !over;
    var fillCls = over?'over':urgent?'urgent':'';
    var d = over?0:Math.ceil(T.restRemain);
    panel.innerHTML = '<div class="tm-set-lbl">'+(isDone?'Last set done':'Rest - set '+T.setsDone+' complete')+'</div>'
      + '<div class="tm-ring-wrap">'
        + '<svg class="tm-ring-svg" viewBox="0 0 160 160">'
          + '<circle class="tm-ring-track" cx="80" cy="80" r="70"/>'
          + '<circle class="tm-ring-fill '+fillCls+'" id="tm-arc" cx="80" cy="80" r="70" stroke-dashoffset="'+offset+'"/>'
        + '</svg>'
        + '<div class="tm-ring-inner">'
          + '<div class="tm-ring-time" id="tm-rtime">'+(over?'Go!':pad2(d/60)+':'+pad2(d%60))+'</div>'
          + '<div class="tm-ring-sub">'+(over?'':'remaining')+'</div>'
        + '</div>'
      + '</div>'
      + '<div class="tm-rest-presets">'
        + [60,90,120,180].map(function(s){return '<button class="t-preset'+(T.restTarget===s?' active':'')+'" data-s="'+s+'">'+(s<120?s+'s':Math.round(s/60)+'m')+'</button>';}).join('')
      + '</div>'
      + '<button class="tm-action-btn'+(isDone?' alldone':'')+'" id="tm-next-set">'+(isDone?'All sets done':'Next set')+'</button>'
      + '<button class="tm-secondary-btn" id="tm-skip">Skip rest</button>'
      + '<button class="tm-add-set-btn" id="tm-add-set">+ add set</button>';

    panel.querySelectorAll('.t-preset').forEach(function(b){
      b.addEventListener('click',function(){
        clearInterval(T.restIv); T.restTarget=parseInt(b.dataset.s); T.restRemain=T.restTarget;
        renderTM(); tmTickRest(vk);
      });
    });
    panel.querySelector('#tm-next-set').addEventListener('click',function(){
      clearInterval(T.restIv);
      if(T.setsDone>=T.totalSets){T.state='idle';renderTM();}else{startGetReady(vk);renderTM();}
    });
    panel.querySelector('#tm-skip').addEventListener('click',function(){
      clearInterval(T.restIv);
      if(T.setsDone>=T.totalSets){T.state='idle';renderTM();}else{startGetReady(vk);renderTM();}
    });
    bindAddSetBtn(panel, T, ex);
    tmTickRest(vk);
  }
}

function syncTMAfterSet(vk) {
  if(!tmState) return;
  // Look for whichever tracker just became active (next in superset)
  // or which lead tracker is now resting
  var activeVk = null, restingLeadVk = null;
  tmState.flat.forEach(function(it){
    var Ti = setTrackers[it.vk];
    if(!Ti) return;
    if(Ti.state === 'active') activeVk = it.vk;
    // Lead tracker resting means round just finished, next round starts on lead
    if(Ti.state === 'resting' && Ti.supersetPeers && Ti.supersetPeers[0] === it.vk) restingLeadVk = it.vk;
  });
  if(activeVk) {
    var idx = tmState.flat.findIndex(function(it){return it.vk===activeVk;});
    if(idx>=0) tmState.idx = idx;
  } else if(restingLeadVk) {
    var idx2 = tmState.flat.findIndex(function(it){return it.vk===restingLeadVk;});
    if(idx2>=0) tmState.idx = idx2;
  }
  renderTM();
}

function tmTickRest(vk) {
  var T = setTrackers[vk];
  clearInterval(T.restIv);
  var TM_RING_C = 439.6;
  var t0=Date.now(), r0=T.restRemain;
  T.restIv = setInterval(function(){
    T.restRemain = r0 - (Date.now()-t0)/1000;
    var arc=document.getElementById('tm-arc'), rt=document.getElementById('tm-rtime');
    if(!arc||!rt) {
      // Elements gone (user navigated away) - stop the interval
      clearInterval(T.restIv); return;
    }
    var frac=Math.max(0,Math.min(1,T.restRemain/T.restTarget));
    arc.style.strokeDashoffset = TM_RING_C*(1-frac);
    var urgent=T.restRemain<=10&&T.restRemain>0;
    arc.className='tm-ring-fill'+(urgent?' urgent':'');
    var d=Math.max(0,Math.ceil(T.restRemain));
    rt.textContent=pad2(d/60)+':'+pad2(d%60);
    if(rt.nextElementSibling) rt.nextElementSibling.textContent='remaining';
    // Auto-transition to getready when rest hits 0
    if(T.restRemain <= 0) {
      clearInterval(T.restIv);
      if(T.setsDone < T.totalSets) {
        startGetReady(vk);
        renderTM();
      } else {
        T.state='idle'; renderTM();
      }
    }
  }, 200);
}

function exportRoutines() {
  try {
    var payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      routines: library
    };
    var json = JSON.stringify(payload, null, 2);
    var blob = new Blob([json], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'workout_routines_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setDataStatus('Routines exported');
  } catch(e) { setDataStatus('Export failed: ' + e.message, true); }
}

function importRoutines(file) {
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parsed = JSON.parse(e.target.result);
      var routines = parsed.routines || parsed; // support both wrapped and bare array
      if(!Array.isArray(routines)) throw new Error('Invalid file - expected array of routines');
      var added = 0;
      routines.forEach(function(r) {
        if(!r.name) return;
        var exists = library.some(function(l){ return l.name === r.name; });
        if(!exists) { library.push(r); added++; }
      });
      saveLib(); renderLib();
      setDataStatus('Imported ' + added + ' routine' + (added!==1?'s':'') + ' (' + (routines.length-added) + ' already existed)');
    } catch(e) { setDataStatus('Import failed: ' + e.message, true); }
  };
  reader.readAsText(file);
}

function exportData() {
  try {
    var payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      weekData: weekData,

    };

}

function importData(file) {
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var parsed = JSON.parse(e.target.result);
      if(!parsed.weekData) throw new Error('Invalid file - no weekData found');
      // Merge: imported data takes priority, but keep any local weeks not in import
      var importedWeeks = Object.keys(parsed.weekData);
      importedWeeks.forEach(function(wk) {
        weekData[wk] = parsed.weekData[wk];
      });
      if(parsed.library && parsed.library.length > 0) {
        library = parsed.library;
        saveLib();
      }
      save();
      renderAll();
      renderLib();
      setDataStatus('Imported ' + importedWeeks.length + ' weeks of data');
    } catch(e) {
      setDataStatus('Import failed: ' + e.message, true);
    }
  };
  reader.readAsText(file);
}

function hexToRgb(hex) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return {r:r,g:g,b:b};
}

function getContrastColour(hex) {
  var c = hexToRgb(hex);
  // Perceived luminance - if bright use dark text, if dark use light text
  var lum = (0.299*c.r + 0.587*c.g + 0.114*c.b) / 255;
  return lum > 0.55 ? '#1A1A1A' : '#FFFFFF';
}

// Muscle group mapping - which session types / exercise keywords hit which groups
var MUSCLE_MAP = {
  chest:    ['bench','press up','push up','chest','dip','fly'],
  back:     ['single arm row','bent over row','cable row','seated row','pull up','pull-up','pullup','deadlift','rdl','face pull','lat pulldown'],
  shoulder: ['overhead press','ohp','lateral raise','shoulder','face pull','press'],
  legs:     ['squat','lunge','leg press','leg extension','calf','rdl','deadlift','hip thrust','glute'],
  core:     ['plank','sit up','situp','crunch','leg raise','dead bug','hollow','bicycle'],
  bicep:    ['curl','chin up','pull up','pull-up'],
  tricep:   ['dip','tricep','pushdown','skull','press up','push up','bench'],
  cardio:   ['cardio','run','cycle','row','swim','walk','football','cricket','bike']
};

// Session type to primary muscle groups
var SESS_MUSCLES = {
  pull:     ['back','bicep'],
  push:     ['chest','tricep','shoulder'],
  legs:     ['legs','core'],
  upper:    ['chest','back','shoulder','bicep','tricep'],
  circuit:  ['chest','back','legs','core'],
  cardio:   ['cardio'],
  af:       ['chest','back','legs','shoulder','bicep','tricep','core'],
  af_bicep: ['chest','back','legs','shoulder','core'],
  uppers_v1:['chest','back','shoulder','bicep','tricep','core'],
  legs_v2:  ['legs','core']
};

function getSessionMuscles(sess) {
  var muscles = new Set();
  // Start from session type
  var typeMuscles = SESS_MUSCLES[sess.type] || [];
  typeMuscles.forEach(function(m){ muscles.add(m); });
  // Scan exercise names for muscle groups — but EXCLUDE cardio from keyword scanning
  // (cardio only counts when the session type IS cardio, not from warmup rows etc.)
  var strengthMuscles = Object.keys(MUSCLE_MAP).filter(function(m){ return m !== 'cardio'; });
  (sess.groups||[]).forEach(function(g){
    g.exercises.forEach(function(ex){
      var name = (ex.name||'').toLowerCase();
      strengthMuscles.forEach(function(muscle){
        MUSCLE_MAP[muscle].forEach(function(keyword){
          if(name.indexOf(keyword) >= 0) muscles.add(muscle);
        });
      });
    });
  });
  return Array.from(muscles);
}

function getSessionLoad(sess) {
  // Return intensity score 1-3: 1=light, 2=moderate, 3=heavy
  if(sess.type === 'cardio') return 1;
  var totalSets = countSets(sess);
  if(totalSets <= 6) return 1;
  if(totalSets <= 15) return 2;
  return 3;
}

function analyseWeek(days) {
  var result = {
    totalSessions: 0,
    totalMins: 0,
    restDays: 0,
    muscleCounts: {},   // muscle: number of sessions hitting it
    consecutiveHard: 0,
    maxConsecutive: 0,
    hardDays: 0,
    warnings: [],
    tips: []
  };

  // Count muscle hits across the week
  Object.keys(MUSCLE_MAP).forEach(function(m){ result.muscleCounts[m] = 0; });

  var consecutive = 0;
  days.forEach(function(daySessions, di) {
    if(!daySessions || daySessions.length === 0) {
      result.restDays++;
      if(consecutive > result.maxConsecutive) result.maxConsecutive = consecutive;
      consecutive = 0;
      return;
    }
    result.totalSessions += daySessions.length;
    consecutive++;

    var dayHard = false;
    daySessions.forEach(function(sess) {
      var mins = estimateTime(sess.groups||[]);
      result.totalMins += mins;
      var muscles = getSessionMuscles(sess);
      muscles.forEach(function(m){ result.muscleCounts[m] = (result.muscleCounts[m]||0)+1; });
      if(getSessionLoad(sess) >= 2) dayHard = true;
    });
    if(dayHard) result.hardDays++;
  });
  if(consecutive > result.maxConsecutive) result.maxConsecutive = consecutive;

  // Generate warnings
  if(result.restDays < 2) result.warnings.push('Less than 2 rest days — recovery is where you grow');
  if(result.maxConsecutive >= 3) result.warnings.push(result.maxConsecutive + ' consecutive training days — risk of overreaching');
  if(result.totalMins > 360) result.warnings.push('Over 6 hours total training — consider reducing volume');
  if(result.totalSessions > 6) result.warnings.push(result.totalSessions + ' sessions this week — very high frequency');
  if((result.muscleCounts.chest||0) > 3) result.warnings.push('Chest hit ' + result.muscleCounts.chest + '× this week — make sure 48h between chest sessions');
  if((result.muscleCounts.back||0) > 3) result.warnings.push('Back hit ' + result.muscleCounts.back + '× this week — ensure adequate recovery between sessions');
  if((result.muscleCounts.legs||0) > 3) result.warnings.push('Legs hit ' + result.muscleCounts.legs + '× — heavy leg work needs 72h recovery');
  if((result.muscleCounts.shoulder||0) > 3) result.warnings.push('Shoulders hit ' + result.muscleCounts.shoulder + '× — rotator cuff needs recovery time');

  // Tips
  if(result.restDays === 0) result.tips.push('Schedule at least one full rest day — even active recovery (walk, stretch) counts');
  if(result.maxConsecutive >= 4) result.tips.push('Try to cap consecutive training days at 3 — insert a rest or light cardio day');
  if(!result.muscleCounts.core || result.muscleCounts.core < 2) result.tips.push('Core appears light this week — add a plank or dead bug to one session');
  if(result.totalMins < 90 && result.totalSessions < 3) result.tips.push('Week looks light — good for deload, otherwise consider adding a session');

  // Traffic light
  if(result.warnings.length === 0) result.light = 'green';
  else if(result.warnings.length <= 2) result.light = 'amber';
  else result.light = 'red';

  return result;
}

function renderLoadBar() {
  var wk = getWK(weekOffset);
  var days = getWeek(wk);
  var analysis = analyseWeek(days);

  var lightEl = document.getElementById('load-light');
  var headlineEl = document.getElementById('load-headline');
  var detailEl = document.getElementById('load-detail');
  if(!lightEl||!headlineEl||!detailEl) return;

  // Set traffic light
  lightEl.className = 'load-light ' + analysis.light;

  // Headline
  var headlines = {
    green: 'Week looks well balanced',
    amber: 'Week is manageable — a few things to watch',
    red: 'Week looks too heavy — consider adjusting'
  };
  headlineEl.textContent = headlines[analysis.light]
    + ' · ' + analysis.totalSessions + ' sessions'
    + ' · ~' + Math.round(analysis.totalMins/60*10)/10 + 'h'
    + ' · ' + analysis.restDays + ' rest day' + (analysis.restDays!==1?'s':'');

  // Detail panel
  var html = '';

  // Session overview
  html += '<div class="load-section-title">This week</div>';
  html += '<div class="load-row"><span class="load-row-label">Total sessions</span><span class="load-row-val">'+analysis.totalSessions+'</span></div>';
  html += '<div class="load-row"><span class="load-row-label">Estimated training time</span><span class="load-row-val">~'+Math.round(analysis.totalMins)+' min</span></div>';
  html += '<div class="load-row"><span class="load-row-label">Rest days</span><span class="load-row-val">'+analysis.restDays+'/7 '+(analysis.restDays>=2?'✓':'⚠')+'</span></div>';
  html += '<div class="load-row"><span class="load-row-label">Max consecutive days</span><span class="load-row-val">'+analysis.maxConsecutive+' '+(analysis.maxConsecutive<=2?'✓':analysis.maxConsecutive<=3?'~':'⚠')+'</span></div>';

  // Muscle group frequency
  html += '<div class="load-section-title">Muscle group frequency</div>';
  var muscleOrder = ['chest','back','shoulder','legs','core','bicep','tricep','cardio'];
  muscleOrder.forEach(function(m) {
    var count = analysis.muscleCounts[m]||0;
    if(count === 0) return;
    // Realistic weekly frequency targets:
    // legs: optimal 2x, ok up to 3x | chest/back/shoulder: optimal 2x, ok up to 3x
    // bicep/tricep: ok up to 4x (often hit indirectly) | cardio: ok up to 5x
    var maxOk = (m==='legs')?2:(m==='cardio')?5:(m==='bicep'||m==='tricep')?3:2;
    var maxHigh = (m==='legs')?3:(m==='cardio')?7:(m==='bicep'||m==='tricep')?4:3;
    var pct = Math.min(100, Math.round(count/maxHigh*100));
    var badge = count<=maxOk?'ok':count<=maxHigh?'warn':'over';
    var badgeLabel = count===1?'once':count+'×'+(count>maxHigh?' — high':'');
    html += '<div class="load-row">'
      + '<span class="load-row-label">'+m.charAt(0).toUpperCase()+m.slice(1)+'</span>'
      + '<div class="load-muscle-bar"><div class="load-muscle-fill" style="width:'+pct+'%"></div></div>'
      + '<span class="load-row-badge load-badge-'+badge+'">'+badgeLabel+'</span>'
      + '</div>';
  });

  // Warnings
  if(analysis.warnings.length > 0) {
    html += '<div class="load-section-title">Warnings</div>';
    analysis.warnings.forEach(function(w){
      html += '<div class="load-row"><span style="color:var(--dc);margin-right:6px">⚠</span><span class="load-row-label">'+w+'</span></div>';
    });
  }

  // Tips
  if(analysis.tips.length > 0) {
    html += '<div class="load-tip">';
    analysis.tips.forEach(function(t){ html += '💡 '+t+'<br>'; });
    html += '</div>';
  }

  detailEl.innerHTML = html;

  // Wire toggle
  var hdr = document.getElementById('load-hdr');
  var tog = document.getElementById('load-toggle');
  if(hdr) {
    hdr.onclick = function() {
      var open = detailEl.classList.toggle('open');
      if(tog) tog.innerHTML = open ? '&#9650; details' : '&#9660; details';
    };
  }
}
